<!DOCTYPE html>
<html lang="de" data-projekt="schulprozesse">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schulprozesse</title>
<!-- Tokens zuerst, die projekteigene Datei zuletzt: So gewinnt
     style.css im Zweifel, und die Werte kommen dennoch aus einer
     Quelle. -->
<link rel="stylesheet" href="vendor/ci-css/ci-tokens.css?v=20260817214226">
<link rel="stylesheet" href="vendor/ci-css/ci-komponenten.css?v=20260817214226">
<link rel="stylesheet" href="vendor/ci-css/ci-shell.css?v=20260817214226">
<link rel="stylesheet" href="css/style.css?v=20260817214226">
</head>
<body>

<a href="#app" class="skip-link">Zum Inhalt springen</a>


<!-- Gerüst aus hornse/ci-css, Variante Kopfleiste: sechs
     Navigationspunkte. Die frühere zweizeilige dunkle Leiste ist einer
     einzeiligen hellen gewichen – entschieden für alle fünf
     Anwendungen der Reihe. -->
<div class="ci-huelle ci-huelle--kopf" data-ci-huelle data-leiste="voll"
     data-ci-icons="vendor/ci-css/ci-icons.svg?v=20260817214226">

  <header class="ci-leiste">
    <div class="ci-leiste-innen">
      <div class="ci-schild">
        <!-- Ist ein Logo hinterlegt, tritt es an die Stelle des
             Platzhalters; app.js schaltet um, sobald /api/einstellungen/logo
             ein Bild liefert. -->
        <span class="ci-schild-platzhalter" id="shell-platzhalter" aria-hidden="true">S</span>
        <img id="shell-logo" class="ci-schild-logo" src="/api/einstellungen/logo"
             alt="" hidden>
        <span class="ci-schild-text">
          <span class="ci-schild-name" id="brand-titel">Schulprozesse</span>
          <span class="ci-schild-schule" id="brand-text">Friedrich-Rückert-Gymnasium</span>
        </span>
      </div>

      <button type="button" class="ci-menue-knopf" data-ci-menue aria-expanded="false">
        <svg class="ci-symbol" aria-hidden="true"><use href="#ci-i-menue"></use></svg>
        Menü
      </button>

      <nav class="ci-nav" id="shell-nav" aria-label="Hauptnavigation">
        <!-- wird von app.js befüllt -->
      </nav>
      <div id="shell-user" class="ci-kopf-rechts"></div>
    </div>
  </header>

  <!-- Prozess-Tabs. Bleiben projekteigen: Das kennt keine andere
       Anwendung der Reihe, und ein Modul soll nichts mitschleppen,
       was nur einer braucht. -->
  <div id="prozess-leiste" style="display:none;" class="prozess-leiste"></div>

  <main class="ci-inhalt">
    <div class="ci-inhalt-innen" id="app" tabindex="-1">
      <p class="ci-leer">Lädt…</p>
    </div>
  </main>
</div>

<footer>
  <span id="wer-bin-ich"></span>
</footer>

<script src="vendor/ci-css/ci-shell.js?v=20260817214226"></script>
<script src="js/app.js?v=20260817214226"></script>
</body>
</html>
